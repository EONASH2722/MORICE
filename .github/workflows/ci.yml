name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install PySide6 numpy sounddevice vosk Pillow
      - name: Compile Python
        run: python -m compileall -q morice
      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: vnext/pnpm-lock.yaml
      - name: Install VNext dependencies
        working-directory: vnext
        run: pnpm install --frozen-lockfile
      - name: Test VNext
        working-directory: vnext
        run: pnpm test
      - name: Typecheck VNext
        working-directory: vnext
        run: pnpm run typecheck
