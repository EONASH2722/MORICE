name: Release validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-source-and-python-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python tooling
        run: python -m pip install -e ".[dev,research]"

      - name: Validate version metadata
        run: python scripts/validate_version.py --root .

      # The main CI workflow owns the complete application regression suite.
      # Release publication requires its success for the same commit alongside
      # this package validation; do not repeat the long suite on a second VM.

      - name: Run VNext tests and typecheck
        working-directory: vnext
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run typecheck

      - name: Build wheel and source distribution
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            python -m build --outdir "${{ github.workspace }}\package-dist" "${{ github.workspace }}"
          }
          finally {
            Pop-Location
          }

      - name: Verify Python package metadata
        run: python -m twine check package-dist/*

      - name: Upload verified Python packages
        uses: actions/upload-artifact@v4
        with:
          name: morice-python-packages
          path: package-dist/*
          if-no-files-found: error
