<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MORICE workflow engine</title>
  <desc id="desc">A dark professional workflow chart showing how MORICE routes chat, queued follow-ups, project builds, science visualizations, web and notes context, and model selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050713"/>
      <stop offset="42%" stop-color="#101428"/>
      <stop offset="74%" stop-color="#052333"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171f38"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="48%" stop-color="#24b8d6"/>
      <stop offset="100%" stop-color="#7df2a8"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5130c8"/>
      <stop offset="100%" stop-color="#1c9cc2"/>
    </linearGradient>
    <linearGradient id="science" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f82db"/>
      <stop offset="100%" stop-color="#26d3b1"/>
    </linearGradient>
    <linearGradient id="context" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e8f66"/>
      <stop offset="100%" stop-color="#a5e86c"/>
    </linearGradient>
    <filter id="glow" x="-24%" y="-24%" width="148%" height="148%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.78 0 0 0 0 1 0 0 0 0.56 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9bdcff"/>
    </marker>
    <style>
      .title { font-family: Segoe UI, Inter, Arial, sans-serif; fill: #f7fbff; font-size: 30px; font-weight: 800; }
      .subtitle { font-family: Segoe UI, Inter, Arial, sans-serif; fill: #c6d7e8; font-size: 16px; }
      .label { font-family: Segoe UI, Inter, Arial, sans-serif; fill: #ffffff; font-size: 22px; font-weight: 800; }
      .small { font-family: Segoe UI, Inter, Arial, sans-serif; fill: #d7e7f6; font-size: 14px; }
      .tiny { font-family: Segoe UI, Inter, Arial, sans-serif; fill: #b9d5e8; font-size: 13px; }
      .box { stroke: rgba(180,220,255,0.45); stroke-width: 1.5; rx: 20; filter: url(#glow); }
      .line { fill: none; stroke: #9bdcff; stroke-width: 3; marker-end: url(#arrow); opacity: 0.88; }
      .rail { fill: rgba(255,255,255,0.055); stroke: rgba(170,210,255,0.24); stroke-width: 1.2; rx: 18; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 612 C155 560 260 646 420 590 C560 540 680 540 826 598 C980 660 1110 640 1280 584 L1280 720 L0 720 Z" fill="url(#accent)" opacity="0.16"/>

  <g opacity="0.82">
    <circle cx="120" cy="108" r="2" fill="#e8fbff"/>
    <circle cx="244" cy="86" r="1.7" fill="#c9f0ff"/>
    <circle cx="426" cy="124" r="2.2" fill="#ffffff"/>
    <circle cx="650" cy="78" r="1.7" fill="#a7e7ff"/>
    <circle cx="826" cy="118" r="2" fill="#ffffff"/>
    <circle cx="1082" cy="90" r="2.3" fill="#ffffff"/>
    <circle cx="1182" cy="154" r="1.8" fill="#c5f4ff"/>
    <circle cx="180" cy="620" r="1.9" fill="#c5f4ff"/>
    <circle cx="374" cy="650" r="2.2" fill="#ffffff"/>
    <circle cx="928" cy="634" r="2" fill="#b2f7ff"/>
  </g>

  <text x="58" y="62" class="title">MORICE workflow engine</text>
  <text x="58" y="91" class="subtitle">One prompt enters MORICE, then the right local, project, science, or context lane takes over.</text>

  <rect x="58" y="148" width="210" height="94" class="box" fill="rgba(10,15,30,0.94)"/>
  <text x="84" y="184" class="label">User prompt</text>
  <text x="84" y="212" class="small">Chat, Project, Lab</text>
  <text x="84" y="233" class="small">@web, @notes, files</text>

  <line x1="268" y1="195" x2="346" y2="195" class="line"/>

  <rect x="360" y="132" width="246" height="126" class="box" fill="url(#panel)"/>
  <text x="392" y="174" class="label">Intent router</text>
  <text x="392" y="203" class="small">Wake state and mode</text>
  <text x="392" y="224" class="small">Typo-aware command sense</text>
  <text x="392" y="245" class="small">Selected model settings</text>

  <line x1="606" y1="195" x2="682" y2="195" class="line"/>

  <rect x="696" y="132" width="246" height="126" class="box" fill="rgba(8,20,30,0.94)"/>
  <text x="728" y="174" class="label">Local model</text>
  <text x="728" y="203" class="small">Bundled or selected GGUF</text>
  <text x="728" y="224" class="small">Ollama model support</text>
  <text x="728" y="245" class="small">Long-answer budget</text>

  <line x1="942" y1="195" x2="1022" y2="195" class="line"/>

  <rect x="1036" y="148" width="188" height="94" class="box" fill="rgba(10,24,26,0.94)"/>
  <text x="1064" y="184" class="label">Result</text>
  <text x="1064" y="212" class="small">Reply, files, diff,</text>
  <text x="1064" y="233" class="small">graph, or simulation</text>

  <path d="M483 258 C483 306 202 302 202 350" class="line"/>
  <rect x="62" y="350" width="280" height="152" class="box" fill="url(#project)" opacity="0.96"/>
  <text x="92" y="388" class="label">Project Mode</text>
  <text x="92" y="417" class="small">Work-folder snapshot</text>
  <text x="92" y="440" class="small">Safe writes and file diffs</text>
  <text x="92" y="463" class="small">Local fallback builder</text>
  <text x="92" y="486" class="small">Folder-only or full access</text>

  <path d="M483 258 C483 306 484 306 484 350" class="line"/>
  <rect x="372" y="350" width="258" height="152" class="box" fill="url(#science)" opacity="0.96"/>
  <text x="402" y="388" class="label">Inline VNext</text>
  <text x="402" y="417" class="small">Graphs and surfaces render</text>
  <text x="402" y="440" class="small">Physics and molecules run</text>
  <text x="402" y="463" class="small">Workspaces stay in chat</text>
  <text x="402" y="486" class="small">Validation blocks fake output</text>

  <path d="M483 258 C483 306 790 302 790 350" class="line"/>
  <rect x="664" y="350" width="278" height="152" class="box" fill="url(#context)" opacity="0.96"/>
  <text x="694" y="388" class="label">Context lanes</text>
  <text x="694" y="417" class="small">@web for current sources</text>
  <text x="694" y="440" class="small">@notes for private files</text>
  <text x="694" y="463" class="small">Compact context only</text>
  <text x="694" y="486" class="small">Normal chat stays local</text>

  <path d="M819 258 C819 306 1098 302 1098 350" class="line"/>
  <rect x="972" y="350" width="250" height="152" class="box" fill="rgba(18,26,50,0.96)"/>
  <text x="1002" y="388" class="label">Model Browser</text>
  <text x="1002" y="417" class="small">Detect GPU and VRAM</text>
  <text x="1002" y="440" class="small">Score fit and usefulness</text>
  <text x="1002" y="463" class="small">Verify GGUF files</text>
  <text x="1002" y="486" class="small">Switch models in app</text>

  <rect x="214" y="560" width="852" height="86" class="rail"/>
  <text x="252" y="592" class="label" font-size="20">Queue and safety rail</text>
  <text x="252" y="620" class="small">While MORICE is replying, new messages enter the queue instead of interrupting the active job.</text>
  <text x="252" y="642" class="small">The user can reorder, remove, or clear queued work from the panel before it runs.</text>
</svg>
