<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MORICE validated request workflow</title>
  <desc id="desc">A user request is routed to normal chat, VNext visualization, Project Mode, or desktop tools. Every result passes host validation before presentation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64d8ff"/>
    </marker>
    <style>
      .bg{fill:#080b12}.panel{fill:#111824;stroke:#36506a;stroke-width:2}.route{fill:#172438;stroke:#64d8ff;stroke-width:2}.visual{fill:#16312f;stroke:#55d6b0;stroke-width:2}.project{fill:#26203b;stroke:#9c7cff;stroke-width:2}.output{fill:#18232a;stroke:#7fda9a;stroke-width:2}.line{stroke:#64d8ff;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{fill:#f7f9fc;font:700 30px 'Segoe UI',sans-serif}.head{fill:#f7f9fc;font:700 19px 'Segoe UI',sans-serif}.copy{fill:#b9c5d3;font:15px 'Segoe UI',sans-serif}.tag{fill:#64d8ff;font:700 13px Consolas,monospace}.note{fill:#91a1b5;font:14px 'Segoe UI',sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="tag" x="52" y="54">M//FLOW</text>
  <text class="title" x="52" y="91">One request. Host-owned execution.</text>
  <text class="copy" x="52" y="121">Models reason; MORICE routes, validates, renders, writes, and reports the real result.</text>

  <rect class="panel" x="52" y="180" rx="6" width="205" height="108"/>
  <text class="head" x="76" y="219">User request</text>
  <text class="copy" x="76" y="248">Text, file, equation,</text>
  <text class="copy" x="76" y="271">simulation, or project</text>

  <rect class="route" x="330" y="180" rx="6" width="230" height="108"/>
  <text class="tag" x="354" y="208">M//ROUTE</text>
  <text class="head" x="354" y="238">Intent router</text>
  <text class="copy" x="354" y="265">Context + capability check</text>

  <rect class="panel" x="642" y="180" rx="6" width="220" height="108"/>
  <text class="tag" x="666" y="208">M//MODEL</text>
  <text class="head" x="666" y="238">Selected local model</text>
  <text class="copy" x="666" y="265">Reasoning and typed intent</text>

  <rect class="output" x="940" y="180" rx="6" width="208" height="108"/>
  <text class="tag" x="964" y="208">M//RESULT</text>
  <text class="head" x="964" y="238">Visible response</text>
  <text class="copy" x="964" y="265">Real output or clear error</text>

  <path class="line" d="M257 234 H330"/>
  <path class="line" d="M560 234 H642"/>
  <path class="line" d="M862 234 H940"/>

  <rect class="visual" x="52" y="380" rx="6" width="250" height="142"/>
  <text class="tag" x="76" y="410">M//VIS</text>
  <text class="head" x="76" y="440">VNext renderers</text>
  <text class="copy" x="76" y="468">Typed artifact</text>
  <text class="copy" x="76" y="491">Validation + live workspace</text>

  <rect class="project" x="345" y="380" rx="6" width="250" height="142"/>
  <text class="tag" x="369" y="410">M//DEV</text>
  <text class="head" x="369" y="440">Project Mode</text>
  <text class="copy" x="369" y="468">Manifest + protected paths</text>
  <text class="copy" x="369" y="491">Diff preview + explicit apply</text>

  <rect class="route" x="638" y="380" rx="6" width="250" height="142"/>
  <text class="tag" x="662" y="410">M//SYS</text>
  <text class="head" x="662" y="440">Desktop tools</text>
  <text class="copy" x="662" y="468">Typed command + permission</text>
  <text class="copy" x="662" y="491">Execution + verification</text>

  <rect class="output" x="931" y="380" rx="6" width="217" height="142"/>
  <text class="tag" x="955" y="410">M//CHECK</text>
  <text class="head" x="955" y="440">Host validation</text>
  <text class="copy" x="955" y="468">No fake success</text>
  <text class="copy" x="955" y="491">No silent completion</text>

  <path class="line" d="M445 288 V330 H177 V380"/>
  <path class="line" d="M445 288 V380"/>
  <path class="line" d="M445 330 H763 V380"/>
  <path class="line" d="M302 451 H345"/>
  <path class="line" d="M595 451 H638"/>
  <path class="line" d="M888 451 H931"/>

  <text class="note" x="52" y="580">Normal chat stays conversational. Visualization and file operations remain deterministic, inspectable, and honest.</text>
</svg>
